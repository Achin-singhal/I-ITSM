spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:i_itsm_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
app:
  sla:
    monitor:
      enabled: false
  jwt:
    secret: test-only-secret-key-with-at-least-32-bytes
    expiration-ms: 3600000
